name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn audit
        run: |
          yarn audit --level moderate; exit_code=$?
          # yarn audit exit code is a bitmask: 2=low, 4=moderate, 8=high, 16=critical
          # Only fail on moderate and above (bitmask >= 4)
          if [ $((exit_code & 28)) -ne 0 ]; then
            echo "::error::Moderate or higher vulnerabilities found"
            exit 1
          fi

      - name: Security summary
        run: |
          echo "## 🔒 Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "No moderate or higher vulnerabilities found" >> $GITHUB_STEP_SUMMARY
